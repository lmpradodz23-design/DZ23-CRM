[options]
; Caminho dos addons: core da imagem + nossos módulos customizados montados.
addons_path = /mnt/extra-addons,/mnt/oca-addons/helpdesk,/mnt/oca-addons/contract,/mnt/oca-addons/sign,/mnt/oca-addons/field-service
; Senha do gerenciador (defina via .env / ambiente seguro; NÃO commitar valor real).
admin_passwd = CHANGE_ME_MASTER_PASSWORD
; Esconde a tela /web/database/manager (que exibe marca Odoo) — produção.
list_db = False
; Uma base fixa para o CRM (evita o seletor de bancos).
dbfilter = ^dz23crm$
; Logs
log_level = info
; Performance — multiprocesso + limites (melhora resposta)
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
proxy_mode = True
