[options]
; Caminho dos addons: core da imagem + nossos módulos customizados montados.
addons_path = /mnt/extra-addons,/mnt/oca-addons/helpdesk,/mnt/oca-addons/contract,/mnt/oca-addons/sign,/mnt/oca-addons/field-service
; Senha do gerenciador: NÃO é lida daqui. É injetada em runtime via
; --admin-passwd=${ODOO_MASTER_PASSWORD} pelo docker-compose (valor do .env,
; fora do Git). O valor abaixo é um placeholder inerte e SEMPRE sobrescrito
; pela linha de comando; além disso list_db=False desativa o gerenciador web.
admin_passwd = __OVERRIDDEN_AT_RUNTIME__
; Esconde a tela /web/database/manager (que exibe marca Odoo) — produção.
list_db = False
; Uma base fixa para o CRM (evita o seletor de bancos).
dbfilter = ^dz23crm$
; Logs
log_level = info
; Performance — multiprocesso + limites (melhora resposta)
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
proxy_mode = True
