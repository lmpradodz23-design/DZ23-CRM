# Ambiente de DEV/TESTE do DZ23 CRM — Odoo 19 + PostgreSQL.
# Sobe a imagem OFICIAL odoo:19 montando nossos módulos (addons_custom).
# NÃO é produção. Segredos vêm do .env (fora do Git) — SEM defaults: se a
# variável não estiver definida, o compose FALHA (fail-closed), nunca usa
# uma senha conhecida. Portas expostas só em 127.0.0.1 (loopback) — o único
# ingress de produção é um reverse proxy (ver docker-compose.prod.yml, à parte).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dz23-db:/var/lib/postgresql/data
    # Sem portas publicadas: o Postgres só é acessível pela rede interna do compose.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      # Loopback apenas — nada exposto na rede externa em dev.
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?defina ODOO_MASTER_PASSWORD no .env}
    # Gera um conf temporário no container (nunca no host/git) com a senha mestra
    # e os parâmetros de banco vindos do ambiente, e sobe o Odoo com ele.
    command: >
      bash -c 'cp /etc/odoo/odoo.conf /tmp/odoo.conf &&
      { echo "admin_passwd = $$ODOO_MASTER_PASSWORD";
        echo "db_host = $$HOST";
        echo "db_user = $$USER";
        echo "db_password = $$PASSWORD"; } >> /tmp/odoo.conf &&
      exec odoo -c /tmp/odoo.conf'
    volumes:
      - ../addons_custom:/mnt/extra-addons
      - ../addons_oca:/mnt/oca-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
      - dz23-odoo:/var/lib/odoo
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  dz23-db:
  dz23-odoo:
