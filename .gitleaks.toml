# Gitleaks — varredura de segredos do DZ23 CRM.
# Estende as regras padrão e adiciona allowlist para exemplos/placeholders.
title = "DZ23 CRM gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders, exemplos e material de referência — não são segredos."
paths = [
    '''\.env\.example$''',
    '''docs/adr/.*''',
    '''README\.md$''',
    '''ARCHITECTURE\.md$''',
]
regexes = [
    # SOMENTE placeholders explícitos (nunca valores reais de segredo).
    '''troque_[a-z_]+''',
    '''__OVERRIDDEN_AT_RUNTIME__''',
    '''CHANGE_ME[A-Z_]*''',
]
